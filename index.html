<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>CLIENTEO | Agencia de Marketing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }
    .container {
      padding: 50px 20px;
    }
    h1 {
      font-size: 2.5em;
    }
    p {
      color: #cbd5f5;
      margin-bottom: 30px;
    }
    .btn {
      display: inline-block;
      padding: 15px 25px;
      margin: 10px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    .primary {
      background: #22c55e;
      color: black;
    }
    .secondary {
      background: #3b82f6;
      color: white;
    }
    .btn:hover {
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🚀 CLIENTEO</h1>
    <p>Conseguimos clientes para tu negocio y aumentamos tus ventas</p>

    <a href="https://wa.me/TUNUMERO" class="btn primary">
      💬 Quiero más clientes
    </a>

    <a href="#" class="btn secondary">
      📈 Ver servicios
    </a>
  </div>

</body>
</html>
